<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comida · Gastos, menú y lista</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comida">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D9472B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ---- Tema base (Clásico) ---- */
:root{
  --bg:#FBF6EE; --card-rgb:255,255,255; --soft-rgb:251,246,238; --alpha:.72;
  --ink:#2A2320; --muted:#7A6E66; --line:rgba(80,50,20,.14); --edge:rgba(255,255,255,.6);
  --tomato:#D9472B; --tomato-soft:rgba(217,71,43,.14); --green:#3E7C4F; --green-soft:rgba(62,124,79,.16);
  --mustard:#E9B44C; --mustard-soft:rgba(233,180,76,.24); --radius:16px; --blur:14px;
  --btnbg:#2A2320; --btnfg:#fff; --fh:"Bricolage Grotesque",Inter,sans-serif; --fb:Inter,system-ui,sans-serif; --fsz:15px; --scheme:light;
  --bgimg:radial-gradient(circle at 12% 8%,rgba(233,180,76,.55),transparent 42%),radial-gradient(circle at 92% 28%,rgba(217,71,43,.32),transparent 48%),radial-gradient(circle at 25% 96%,rgba(62,124,79,.38),transparent 50%),linear-gradient(#FBF6EE,#F4E6D2);
  --bgsize:cover;
  --card:rgba(var(--card-rgb),var(--alpha));
  --soft:rgba(var(--soft-rgb),calc(var(--alpha) * .85));
  --glass:rgba(var(--card-rgb),calc(var(--alpha) * .5 + .45));
  --sheet:rgba(var(--card-rgb),.97);
  color-scheme:var(--scheme);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--fb);font-size:var(--fsz);line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg);background-size:var(--bgsize);background-position:center}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
header h1{font-size:22px;font-weight:800;flex:1}
header h1 span{color:var(--tomato)}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--green)} .sync.err i{background:var(--tomato)}
.iconbtn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;box-shadow:0 1px 0 var(--line);cursor:pointer}
main{padding:6px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--edge);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 1px 0 var(--line),0 6px 20px -14px rgba(60,40,20,.25)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.big{font-family:var(--fh);font-size:34px;font-weight:800;line-height:1}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.bar>div{height:100%;border-radius:99px;background:var(--green);transition:width .4s}
.bar.warn>div{background:var(--mustard)} .bar.over>div{background:var(--tomato)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.stat{background:var(--soft);border-radius:12px;padding:10px}
.stat b{display:block;font-size:16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--btnbg);color:var(--btnfg);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--tomato);color:#fff} .btn.green{background:var(--green);color:#fff}
.btn.block{width:100%} .btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 4px}
.sec-title h2{font-size:19px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{border:0;border-radius:99px;padding:7px 13px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap;cursor:pointer;font-size:13.5px;font-weight:500}
.chip.on{background:var(--btnbg);color:var(--btnfg);box-shadow:none}
.day{padding:12px 14px}
.day h3{font-size:16px;display:flex;justify-content:space-between;align-items:center}
.day.today{box-shadow:inset 0 0 0 2px var(--tomato),0 6px 20px -14px rgba(60,40,20,.25)}
.badge{font-family:var(--fb);font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--tomato-soft);color:var(--tomato)}
.slot{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);border-radius:12px;padding:9px 10px;margin-top:7px;text-align:left;cursor:pointer}
.slot .em{font-size:22px;width:30px;text-align:center}
.slot .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.slot .nm{font-weight:600}
.slot.empty .nm{color:var(--muted);font-weight:500}
.slot .cost{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{border:0;text-align:left;background:var(--card);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:4px}
.rcard .em{font-size:30px}
.rcard b{font-family:var(--fh);font-size:16px;line-height:1.2}
.search{width:100%;border:0;border-radius:12px;padding:12px 14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);margin-top:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.check{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--sheet)}
.check:checked{background:var(--green);border-color:var(--green)}
.check:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.iname{font-weight:600}
.item .price{margin-left:auto;text-align:right;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{border:0;background:var(--soft);color:var(--ink);width:26px;height:26px;border-radius:8px;cursor:pointer;font-weight:700}
.store-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:2px}
.gasto{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.gasto:first-child{border-top:0}
.gico{width:36px;height:36px;border-radius:10px;background:var(--mustard-soft);display:grid;place-items:center;font-size:18px;flex:none}
.catbar{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.catbar .bar{margin:0;height:9px}
.catbar .bar>div{background:var(--mustard)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-top:1px solid var(--edge);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 0;border-radius:12px;position:relative}
nav a svg{width:23px;height:23px}
nav a.on{color:var(--tomato)}
nav a .dot{position:absolute;top:2px;right:calc(50% - 20px);background:var(--tomato);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:0;border-radius:12px;padding:12px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line)}
.field input:focus,.field select:focus,.search:focus{outline:2px solid var(--tomato);outline-offset:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(30,20,10,.45);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:var(--sheet);border:1px solid var(--edge);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:21px;margin-bottom:4px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.pick{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 4px;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.pick .em{font-size:22px}
.pick .cost{margin-left:auto;color:var(--muted);font-size:13px}
ol.steps{padding-left:20px;margin:6px 0} ol.steps li{margin:6px 0}
ul.ing{list-style:none;padding:0;margin:6px 0}
ul.ing li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.empty-state{text-align:center;padding:26px 10px;color:var(--muted)}
.empty-state .em{font-size:40px}
.prod{display:grid;grid-template-columns:1fr 84px 100px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.prod input,.prod select{border:0;border-radius:9px;padding:8px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line);width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btnbg);color:var(--btnfg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
a.ext{color:var(--tomato);font-weight:600}
textarea{min-height:90px}

/* ---- Nuevos componentes ---- */
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--mustard-soft);color:var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tcard{border:0;background:var(--soft);color:var(--ink);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line)}
.tcard.on{box-shadow:inset 0 0 0 3px var(--tomato)}
.tpv{height:46px;border-radius:9px;display:block;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tpv::after{content:"";position:absolute;left:14%;right:14%;bottom:10%;height:38%;border-radius:6px;background:rgba(255,255,255,.55);backdrop-filter:blur(3px)}
.range{width:100%;accent-color:var(--tomato)}
.fx{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:2px 0;color:inherit}
.fx b{display:block}
.emopick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.emopick label{cursor:pointer}
.emopick input{position:absolute;opacity:0;pointer-events:none}
.emopick span{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--soft);font-size:20px;box-shadow:inset 0 0 0 1.5px var(--line)}
.emopick input:checked+span{box-shadow:inset 0 0 0 3px var(--tomato)}

/* ---- TEMAS ---- */
html[data-theme=noche]{
  --bg:#0d1220; --card-rgb:26,32,54; --soft-rgb:44,52,84; --ink:#EDEFF7; --muted:#9BA4C2; --line:rgba(255,255,255,.14); --edge:rgba(255,255,255,.12);
  --tomato:#FF6B57; --tomato-soft:rgba(255,107,87,.2); --green:#4CC38A; --green-soft:rgba(76,195,138,.2); --mustard:#F2C14E; --mustard-soft:rgba(242,193,78,.2);
  --btnbg:#EDEFF7; --btnfg:#0d1220; --scheme:dark;
  --bgimg:radial-gradient(circle at 15% 12%,rgba(124,92,255,.55),transparent 45%),radial-gradient(circle at 88% 35%,rgba(40,140,255,.4),transparent 50%),radial-gradient(circle at 30% 95%,rgba(255,107,87,.3),transparent 50%),linear-gradient(#0d1220,#151a33);
}
html[data-theme=oceano]{
  --bg:#0b4a6e; --card-rgb:238,250,255; --soft-rgb:214,240,250; --ink:#0b2540; --muted:#46657e; --line:rgba(11,37,64,.15); --edge:rgba(255,255,255,.55);
  --tomato:#F25C54; --tomato-soft:rgba(242,92,84,.16); --green:#0E9F8E; --green-soft:rgba(14,159,142,.18); --mustard:#F4B942; --mustard-soft:rgba(244,185,66,.26);
  --btnbg:#0b2540; --btnfg:#fff;
  --bgimg:radial-gradient(circle at 80% 10%,rgba(120,230,255,.55),transparent 40%),radial-gradient(circle at 10% 70%,rgba(0,190,200,.4),transparent 45%),linear-gradient(165deg,#13a3c4 0%,#1668b0 48%,#0b2a63 100%);
}
html[data-theme=atardecer]{
  --bg:#c2456a; --card-rgb:255,247,242; --soft-rgb:255,232,222; --ink:#3b1d2e; --muted:#8a5a6c; --line:rgba(59,29,46,.15); --edge:rgba(255,255,255,.5);
  --tomato:#D63A5B; --tomato-soft:rgba(214,58,91,.15); --green:#2F8F6B; --green-soft:rgba(47,143,107,.17); --mustard:#F2A93B; --mustard-soft:rgba(242,169,59,.26);
  --btnbg:#3b1d2e; --btnfg:#fff;
  --bgimg:radial-gradient(circle at 50% 0%,rgba(255,225,120,.75),transparent 45%),linear-gradient(170deg,#ff9a5a 0%,#ea5273 45%,#5b2a86 100%);
}
html[data-theme=sakura]{
  --bg:#ffc9dc; --card-rgb:255,255,255; --soft-rgb:255,236,244; --ink:#4a2338; --muted:#9a6a82; --line:rgba(74,35,56,.14); --edge:rgba(255,255,255,.7);
  --tomato:#E0457B; --tomato-soft:rgba(224,69,123,.15); --green:#4F9E78; --green-soft:rgba(79,158,120,.17); --mustard:#F2B64B; --mustard-soft:rgba(242,182,75,.26);
  --btnbg:#4a2338; --btnfg:#fff;
  --bgimg:radial-gradient(circle at 85% 8%,rgba(255,255,255,.8),transparent 40%),radial-gradient(circle at 8% 60%,rgba(190,150,255,.45),transparent 45%),linear-gradient(160deg,#ffe3ee,#ffc2d8 55%,#f7a6c8);
}
html[data-theme=bosque]{
  --bg:#1b4a2e; --card-rgb:243,250,238; --soft-rgb:222,240,216; --ink:#1c2f20; --muted:#587460; --line:rgba(28,47,32,.15); --edge:rgba(255,255,255,.45);
  --tomato:#D9622B; --tomato-soft:rgba(217,98,43,.16); --green:#2E7D46; --green-soft:rgba(46,125,70,.18); --mustard:#E3B341; --mustard-soft:rgba(227,179,65,.28);
  --btnbg:#1c2f20; --btnfg:#fff;
  --bgimg:radial-gradient(circle at 85% 10%,rgba(200,255,150,.4),transparent 42%),radial-gradient(circle at 10% 80%,rgba(20,90,60,.6),transparent 50%),linear-gradient(165deg,#2f7a4a,#1d5a37 55%,#123a26);
}

/* Minecraft */
html[data-theme=minecraft]{
  --bg:#5a3d24; --card-rgb:48,48,52; --soft-rgb:20,20,22; --alpha:.8; --ink:#FFFFFF; --muted:#BDBDBD; --line:rgba(0,0,0,.5); --edge:#000;
  --tomato:#E8473B; --tomato-soft:rgba(232,71,59,.28); --green:#5DBB3A; --green-soft:rgba(93,187,58,.28); --mustard:#FCDB05; --mustard-soft:rgba(252,219,5,.22);
  --btnbg:#7d7d7d; --btnfg:#fff; --blur:3px; --scheme:dark; --radius:0px;
  --fh:"Press Start 2P",monospace; --fb:"VT323",monospace; --fsz:19px;
  --bgimg:conic-gradient(rgba(0,0,0,.2) 25%,transparent 0 50%,rgba(255,255,255,.05) 0 75%,transparent 0),conic-gradient(rgba(0,0,0,.14) 25%,transparent 0 50%,rgba(0,0,0,.08) 0 75%,transparent 0),linear-gradient(#80583a,#5a3d24);
  --bgsize:64px 64px,24px 24px,cover;
}
html[data-theme=minecraft] *{border-radius:0!important}
html[data-theme=minecraft] body{line-height:1.15}
html[data-theme=minecraft] body::before{image-rendering:pixelated}
html[data-theme=minecraft] header h1{font-size:14px}
html[data-theme=minecraft] .big{font-size:22px;text-shadow:3px 3px 0 rgba(0,0,0,.55)}
html[data-theme=minecraft] .sec-title h2{font-size:12px;text-shadow:2px 2px 0 rgba(0,0,0,.6);color:#fff}
html[data-theme=minecraft] .sheet h2{font-size:14px}
html[data-theme=minecraft] .day h3{font-size:12px}
html[data-theme=minecraft] .rcard b{font-size:11px;line-height:1.4}
html[data-theme=minecraft] h3{font-size:12px}
html[data-theme=minecraft] .small{font-size:16px}
html[data-theme=minecraft] .tiny{font-size:14px}
html[data-theme=minecraft] .btn,
html[data-theme=minecraft] .chip,
html[data-theme=minecraft] .iconbtn,
html[data-theme=minecraft] .tcard,
html[data-theme=minecraft] .qty button{border:2px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.35)}
html[data-theme=minecraft] .btn{font-size:18px;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
html[data-theme=minecraft] .btn.alt{background:rgba(var(--card-rgb),.9)}
html[data-theme=minecraft] .card,
html[data-theme=minecraft] #modal .sheet{border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.16),inset -3px -3px 0 rgba(0,0,0,.4)}
html[data-theme=minecraft] .tcard.on{border-color:#FCDB05}
html[data-theme=minecraft] .bar{background:rgba(0,0,0,.6);border:2px solid #000;height:14px}
html[data-theme=minecraft] .bar>div{box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
html[data-theme=minecraft] header,
html[data-theme=minecraft] nav{border-color:#000;border-width:3px}
html[data-theme=minecraft] header{border-bottom:3px solid #000}
html[data-theme=minecraft] nav a{font-size:14px}
html[data-theme=minecraft] .check{border:2px solid #000;background:#8b8b8b}
html[data-theme=minecraft] .check:checked{background:var(--green)}
html[data-theme=minecraft] .tpv{background-image:linear-gradient(transparent 55%,#5DBB3A 55%,#5DBB3A 65%,#80583a 65%)!important}

/* ---- Login ---- */
#login{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bgimg);background-size:var(--bgsize);background-color:var(--bg)}
#login.open{display:flex}
#login .box{width:100%;max-width:380px;background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--edge);border-radius:22px;padding:26px 22px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
#login h1{font-size:30px;text-align:center;font-weight:800}
#login h1 span{color:var(--tomato)}
#login p.sub{text-align:center;margin:4px 0 18px}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.ubtn{border:0;background:var(--soft);color:var(--ink);border-radius:14px;padding:14px 8px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:inset 0 0 0 1.5px var(--line)}
.ubtn .av{width:44px;height:44px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;font-size:20px;font-family:var(--fh)}
.ubtn.on{box-shadow:inset 0 0 0 3px var(--tomato)}

function aplicarTema(){
  const r=document.documentElement;
  if(!TEMAS[S.tema])S.tema='clasico';
  r.dataset.theme=S.tema;
  const op=Math.min(100,Math.max(25,+S.opac||72));
  r.style.setProperty('--alpha',op/100);

let docRef=null,loaded=false,editedEarly=false,saveT=null,saving=false,again=false;
function setSync(kind,txt){const el=document.getElementById('sync');el.className='sync '+(kind||'');el.querySelector('span').textContent=txt}
function persist(){
  S._at=Date.now();
  try{localStorage.setItem('comida-pref:'+USER,JSON.stringify({tema:S.tema,opac:S.opac,acento:S.acento}))}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!loaded){editedEarly=true;return}
  if(!docRef)return;
  clearTimeout(saveT);setSync('','Guardando…');saveT=setTimeout(flush,1000);
}
let baseAt=0;
// Une cambios de dos personas: listas por id (gana lo local), pagos por clave; el resto lo local.
function fusion(loc,rem){
  const out=Object.assign({},rem,loc);
  const uni=(a,b)=>{const m=new Map();(b||[]).forEach(x=>m.set(x.id,x));(a||[]).forEach(x=>m.set(x.id,x));return [...m.values()]};
  out.gastos=uni(loc.gastos,rem.gastos);
  out.lista=uni(loc.lista,rem.lista);
  const fm=new Map();(rem.fijos||[]).forEach(f=>fm.set(f.id,f));
  (loc.fijos||[]).forEach(f=>{const r=fm.get(f.id);fm.set(f.id,r?Object.assign({},r,f,{pagos:Object.assign({},r.pagos,f.pagos)}):f)});
  out.fijos=[...fm.values()];
  return out;
}
function aplicaPref(){
  try{const r=localStorage.getItem('comida-pref:'+USER);if(r){const o=JSON.parse(r);if(o.tema)S.tema=o.tema;if(o.opac)S.opac=o.opac;S.acento=o.acento||null}}catch(e){}
}
const enFoco=()=>{const ae=document.activeElement;return !!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))};
async function flush(){
  saveT=null;
  if(!docRef)return;
  if(saving){again=true;return}
  saving=true;
  const envia=async()=>{
    if(SUPA.url){
      const snap=await docRef.get();
      if(snap.exists){try{const rem=JSON.parse(snap.data().json);if((rem._at||0)>baseAt){S=fusion(S,rem);S._at=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!enFoco())render()}}catch(e){}}
    }
    await docRef.set({json:JSON.stringify(S),at:S._at||Date.now()});
    baseAt=S._at||baseAt;
  };
  try{await envia();setSync('ok','Guardado')}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await envia();setSync('ok','Guardado')}catch(e2){setSync('err','Solo en este equipo')}}
    else setSync('err','Solo en este equipo');
  }
  saving=false;if(again){again=false;flush()}
}
async function initCloud(){
  setSync('','Conectando…');
  try{
    let ref=null;
    if(SUPA.url){
      if(!TOK){setSync('','Solo en este equipo');loaded=true;return}
      ref=supaDoc();
    }else{
      if(!window.claude||!window.claude.use){setSync('','Solo en este equipo');loaded=true;return}
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const u=user?await user.id():null;
      if(!db||!u){setSync('','Solo en este equipo');loaded=true;return}
      ref=db.doc('data/users/'+u+'/estado_'+USER);
    }
    docRef=ref;
    const timer=setTimeout(()=>setSync('err','Sin conexión'),10000);
    let snap=await docRef.get();clearTimeout(timer);
    let usoRemoto=false;
    if(!snap.exists&&ref.legacy){const lg=await ref.legacy();if(lg&&lg.exists)snap=lg}   // datos anteriores de este usuario
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json){try{
        const rem=JSON.parse(d.json);
        baseAt=Math.max(baseAt,rem._at||0);
        if(seeded){S=fusion(rem,S);S._at=Date.now();usoRemoto=false}      // datos locales viejos: se suman, mandan los compartidos
        else if(!editedEarly&&(rem._at||0)>=(S._at||0)){S=merge(rem);usoRemoto=true;try{localStorage.setItem(KEY,d.json)}catch(e){}}
      }catch(e){}}
    }
    seeded=false;aplicaPref();
    loaded=true;setSync('ok',SUPA.url?'Sincronizado':'En la nube');aplicarTema();render();
    if(!snap.exists||!usoRemoto)flush();
    startPoll();
  }catch(e){
    loaded=true;docRef=null;
    if(e&&e.code==='auth'){salir();return}
    setSync('','Solo en este equipo');
  }
}
let pollT=null;
function startPoll(){
  if(pollT)return;
  pollT=setInterval(()=>{if(!document.hidden)pull()},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  window.addEventListener('online',pull);
}
// Trae los cambios hechos desde otro dispositivo (si son más nuevos que los locales)
async function pull(){
  if(!USER)return;
  if(!docRef){if(SUPA.url&&TOK)initCloud();return}
  if(saveT||saving||$('#modal').classList.contains('open')||enFoco())return;
  try{
    const snap=await docRef.get();if(!snap.exists)return;
    const d=snap.data(),rem=JSON.parse(d.json);
    if((rem._at||0)>(S._at||0)){S=merge(rem);baseAt=rem._at||baseAt;aplicaPref();try{localStorage.setItem(KEY,d.json)}catch(e){}aplicarTema();render();setSync('ok','Sincronizado')}
  }catch(e){}
}

function gastosMes(m){return S.gastos.filter(g=>mesKey(g.fecha)===m)}

function costoMenuSemana(){let t=0;for(const [k] of DIAS){const d=S.menu[k]||{};for(const ti in TIPOS){if(d[ti]&&R[d[ti]])t+=costoReceta(R[d[ti]])}}return t}
const presSemana=()=>(+S.presupuesto||0)*12/52;
const itemCost=i=>(+i.precio||0)*(+i.cant||0);

  $('#app').innerHTML=v();

function resumenMes(m){
  const gastado=gastosMes(m).reduce((s,g)=>s+(+g.monto||0),0);
  const pres=+S.presupuesto||0, rest=pres-gastado, pct=pres?gastado/pres*100:0;
  return {gastado,pres,rest,pct};
}

function mesesConDatos(){
  const set=new Set([hoy().slice(0,7)]);
  S.gastos.forEach(g=>set.add(mesKey(g.fecha)));
  S.fijos.forEach(f=>Object.keys(f.pagos||{}).forEach(k=>set.add(monthOfKey(k))));
  return [...set].sort().reverse();
}
function datosMes(m){
  const comida=gastosMes(m).reduce((s,g)=>s+(+g.monto||0),0);
  const fijos=S.fijos.reduce((t,f)=>t+Object.keys(f.pagos||{}).filter(k=>monthOfKey(k)===m).reduce((x,k)=>x+montoPagado(f,k),0),0);
  return {comida,fijos,total:comida+fijos};
}

function descargarCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const L=[['usuario','tipo','fecha_o_mes','concepto','categoria','monto']];
  const u=(USUARIOS[USER]||{}).n||'';
  S.gastos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(g=>L.push([u,'comida',g.fecha,g.tienda||'',(CATS[g.cat]||CATS.otros)[1],g.monto]));
  S.fijos.forEach(f=>Object.keys(f.pagos||{}).sort().forEach(k=>L.push([u,'fijo',k[0]==='w'?k.slice(1):k,f.n,f.frec==='sem'?'Fijo semanal':'Fijo mensual',montoPagado(f,k)])));
  const blob=new Blob(['\ufeff'+L.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gastos-'+(USER||'comida')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

let mesFijos=hoy().slice(0,7);
const EMS_FIJO=['🌐','🔥','💡','💧','📱','🏠','📺','🚌','🎓','💊','🛡️','🐶','🎮','🛒','🧾'];
const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function pagadoF(f,key){return !!(f.pagos&&f.pagos[key]!=null)}
function montoPagado(f,key){const v=f.pagos&&f.pagos[key];return typeof v==='number'?v:(v?(+f.monto||0):0)}
function monthOfKey(k){return k[0]==='w'?k.slice(1,8):k}
function diasMes(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
// Cada pago concreto del mes: los mensuales una vez, los semanales una por cada semana (su día cae en el mes).
function ocurrencias(m){
  const [y,mo]=m.split('-').map(Number),dim=diasMes(m),out=[];
  S.fijos.forEach(f=>{
    if(f.frec==='sem'){
      for(let d=1;d<=dim;d++){const dt=new Date(y,mo-1,d);if(dt.getDay()===(+f.dow||0)){const iso=isoDate(dt);out.push({f,fecha:iso,key:'w'+iso})}}
    }else{
      const d=Math.min(dim,Math.max(1,+f.dia||1));out.push({f,fecha:m+'-'+pad(d),key:m});
    }
  });
  out.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.f.n.localeCompare(b.f.n));
  out.forEach(o=>{o.pagado=pagadoF(o.f,o.key);o.monto=o.pagado?montoPagado(o.f,o.key):(+o.f.monto||0)});
  return out;
}
function semanasDelMes(m){
  const [y,mo]=m.split('-').map(Number),dim=diasMes(m),out=[];
  const first=new Date(y,mo-1,1),last=new Date(y,mo-1,dim);
  let ws=new Date(first);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
  while(ws<=last){
    const a=new Date(Math.max(ws,first)),we=new Date(ws);we.setDate(we.getDate()+6);const b=new Date(Math.min(we,last));
    out.push({ini:isoDate(a),fin:isoDate(b),dias:Math.round((b-a)/864e5)+1});
    ws=new Date(ws);ws.setDate(ws.getDate()+7);
  }
  return out;
}
const fechaCorta=iso=>{const d=new Date(iso+'T12:00');return d.getDate()+' '+MESC[d.getMonth()]};
function badgeOc(o){
  if(o.pagado)return '<span class="badge ok">Pagado</span>';
  const h=hoy();
  if(o.fecha<h)return '<span class="badge">Vencido</span>';
  if(o.fecha===h)return '<span class="badge">Hoy</span>';
  const d=Math.round((new Date(o.fecha+'T12:00')-new Date(h+'T12:00'))/864e5);
  if(d<=3)return `<span class="badge warn">En ${d} día${d>1?'s':''}</span>`;
  return '<span class="badge warn">'+fechaCorta(o.fecha)+'</span>';
}
function filaOc(o){
  const f=o.f,sem=f.frec==='sem';
  return `<div class="gasto"><input type="checkbox" class="check" data-act="togglePago" data-id="${f.id}" data-key="${o.key}" ${o.pagado?'checked':''} aria-label="Marcar ${esc(f.n)} como pagado">
    <button class="fx" data-act="editFijo" data-id="${f.id}"><b>${esc(f.em||'🧾')} ${esc(f.n)}</b><div class="small muted">${sem?'Semanal · '+DOW[+f.dow||0]+' '+fechaCorta(o.fecha):'Mensual · '+fechaCorta(o.fecha)}</div></button>
    <div style="text-align:right"><b>${fmt2.format(o.monto)}</b><div>${badgeOc(o)}</div></div></div>`;
}
function vFijos(){
  const m=mesFijos,oc=ocurrencias(m),dim=diasMes(m);
  const total=oc.reduce((s,o)=>s+o.monto,0),pagado=oc.filter(o=>o.pagado).reduce((s,o)=>s+o.monto,0);
  const pend=total-pagado,pct=total?pagado/total*100:0,comida=+S.presupuesto||0;
  const semanas=semanasDelMes(m);
  const semTotal=oc.filter(o=>o.f.frec==='sem').reduce((s,o)=>s+o.monto,0),menTotal=total-semTotal;
  return `
  <div class="card">
    <div class="row between">
      <button class="iconbtn" data-act="mesF" data-d="-1" aria-label="Mes anterior">‹</button>
      <b style="text-transform:capitalize;font-family:var(--fh);font-size:18px">${nombreMes(m)}</b>
      <button class="iconbtn" data-act="mesF" data-d="1" aria-label="Mes siguiente">›</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="tiny muted">Total fijos</span><b>${money(total)}</b></div>
      <div class="stat"><span class="tiny muted">Pagado</span><b style="color:var(--green)">${money(pagado)}</b></div>
      <div class="stat"><span class="tiny muted">Por pagar</span><b style="color:${pend>0?'var(--tomato)':'inherit'}">${money(pend)}</b></div>
    </div>
    <div class="bar"><div style="width:${Math.min(100,pct)}%"></div></div>
    <div class="small muted">Mensuales ${money(menTotal)} · Semanales ${money(semTotal)}</div>
    <button class="btn block red" style="margin-top:12px" data-act="nuevoFijo">+ Agregar gasto</button>

/* ===================== ACCIONES ===================== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generar(modo){
  const nuevo=modo==='huecos'?JSON.parse(JSON.stringify(S.menu)):{};
  for(const t in TIPOS){
    let pool=RECETAS.filter(r=>r.tipo.includes(t));
    if(modo==='eco'){pool=pool.sort((a,b)=>costoReceta(a)-costoReceta(b));pool=pool.slice(0,Math.max(3,Math.ceil(pool.length*.6)))}
    let seq=shuffle(pool),k=0,prev=null;
    for(const [d] of DIAS){
      nuevo[d]=nuevo[d]||{};
      if(modo==='huecos'&&nuevo[d][t]){prev=nuevo[d][t];continue}
      if(k>=seq.length){seq=shuffle(pool);k=0}
      let r=seq[k++];
      if(r.id===prev&&pool.length>1){if(k>=seq.length){seq=shuffle(pool);k=0}r=seq[k++]}
      // evita repetir el mismo platillo en comida y cena del mismo día
      if(t==='n'&&nuevo[d].c===r.id&&pool.length>1){if(k>=seq.length){seq=shuffle(pool);k=0}r=seq[k++]}
      nuevo[d][t]=r.id;prev=r.id;
    }
  }
  S.menu=nuevo;persist();closeModal();render();toast('Menú listo');
}
function necesidades(recetas){
  const tot={};recetas.forEach(r=>r.ing.forEach(([p,q])=>tot[p]=(tot[p]||0)+q*factor()));
  return tot;
}
function itemDesdeProducto(pid,qty){
  const p=PROD[pid];return {pid,nombre:p.n,pres:p.pres,cant:Math.max(1,Math.ceil(qty-0.05)),precio:precio(pid),tienda:tienda(pid)};
}
function agregarItem(it){
  const ex=it.pid&&S.lista.find(i=>i.pid===it.pid&&!i.hecho);
  if(ex){ex.cant=(+ex.cant||0)+it.cant;return}
  S.lista.push(Object.assign({id:uid(),hecho:false},it));
}
function listaDesdeMenu(){
  const recs=[];for(const [d] of DIAS){const m=S.menu[d]||{};for(const t in TIPOS)if(m[t]&&R[m[t]])recs.push(R[m[t]])}
  if(!recs.length){toast('Primero arma tu menú');location.hash='#menu';return}
  const hacer=()=>{
    S.lista=S.lista.filter(i=>!i.auto);
    const tot=necesidades(recs);
    Object.entries(tot).forEach(([pid,q])=>{if(PROD[pid])agregarItem(Object.assign(itemDesdeProducto(pid,q),{auto:true}))});
    persist();render();location.hash='#lista';toast(`Lista creada con ${Object.keys(tot).length} productos`);
  };
  if(S.lista.some(i=>i.auto))confirmar('¿Rehacer la lista?','Se reemplazarán los productos que vinieron del menú. Lo que agregaste a mano se queda.','Rehacer',hacer);
  else hacer();
}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){location.hash='#'+go.dataset.go;return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'salir':salir();break;
    case 'csv':descargarCSV();break;
    case 'verMes':mesVista=el.dataset.m;mesFijos=el.dataset.m;render();window.scrollTo(0,0);break;
    case 'temas':openModal(`<h2>Tema y apariencia</h2><div class="temaBox">${temaInner()}</div><button class="btn alt block" data-act="close">Listo</button>`);break;
    case 'setTema':S.tema=id;aplicarTema();persist();refrescaTemas();break;
    case 'resetAcento':S.acento=null;aplicarTema();persist();refrescaTemas();break;
    case 'nuevoFijo':modalFijo();break;
    case 'editFijo':modalFijo(id);break;
    case 'delFijo':confirmar('¿Borrar este gasto mensual?','Se quitará de tu planeación.','Borrar',()=>{S.fijos=S.fijos.filter(x=>x.id!==id);persist();render()});break;
    case 'togglePago':{const f=S.fijos.find(x=>x.id===id);if(f){f.pagos=f.pagos||{};const k=el.dataset.key||mesFijos;if(el.checked)f.pagos[k]=+f.monto||0;else delete f.pagos[k];persist();render()}break}
    case 'mesF':{const [y,mo]=mesFijos.split('-').map(Number);const d=new Date(y,mo-1+(+el.dataset.d),1);mesFijos=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'nuevoGasto':modalGasto();break;
    case 'editPres':location.hash='#ajustes';break;
    case 'pickSlot':modalPicker(el.dataset.dia,el.dataset.tipo);break;
    case 'setSlot':{const d=el.dataset.dia,t=el.dataset.tipo;S.menu[d]=S.menu[d]||{};if(id)S.menu[d][t]=id;else delete S.menu[d][t];persist();closeModal();render();break}
    case 'verReceta':modalReceta(id);break;
    case 'recetaALista':{const tot=necesidades([R[id]]);Object.entries(tot).forEach(([p,q])=>agregarItem(itemDesdeProducto(p,q)));persist();closeModal();render();toast('Ingredientes agregados a la lista');break}
    case 'generar':modalGenerar();break;
    case 'doGenerar':generar(el.dataset.modo);break;
    case 'limpiarMenu':confirmar('¿Vaciar el menú?','Se quitarán todos los platillos de la semana.','Vaciar',()=>{S.menu={};persist();render()});break;
    case 'listaDesdeMenu':listaDesdeMenu();break;
    case 'filtro':filtroTipo=el.dataset.k;render();break;
    case 'baratas':{const r=RECETAS.slice().sort((a,b)=>costoReceta(a)-costoReceta(b)).slice(0,6);openModal(`<h2>Las 6 más baratas</h2>${r.map(x=>`<button class="pick" data-act="verReceta" data-id="${x.id}"><span class="em">${x.em}</span><b>${esc(x.n)}</b><span class="cost">${money(costoReceta(x))}</span></button>`).join('')}<button class="btn alt block" style="margin-top:12px" data-act="close">Cerrar</button>`);break}
    case 'toggle':{const i=S.lista.find(x=>x.id===id);if(i){i.hecho=el.checked;persist();render()}break}
    case 'mas':case 'menos':{const i=S.lista.find(x=>x.id===id);if(i){i.cant=Math.max(1,(+i.cant||1)+(a==='mas'?1:-1));persist();render()}break}
    case 'delItem':S.lista=S.lista.filter(x=>x.id!==id);persist();render();break;
    case 'nuevoItem':modalItem();break;
    case 'limpiarHechos':S.lista=S.lista.filter(i=>!i.hecho);persist();render();break;
    case 'registrarCompra':{const d=S.lista.filter(i=>i.hecho);const total=d.reduce((s,i)=>s+itemCost(i),0);
      const cnt={};d.forEach(i=>cnt[i.tienda]=(cnt[i.tienda]||0)+itemCost(i));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
      const t=top?top[0]:'';modalGasto({titulo:'Registrar compra',monto:total,tienda:t==='3B'?'Tiendas 3B':t,cat:t==='Mercado'?'mercado':t==='Tortillería'?'tortilla':'super',nota:`${d.length} artículos de la lista`,desdeLista:true});
      setTimeout(()=>{const p=document.createElement('p');p.className='small muted';p.textContent='Es un estimado: corrige el monto con lo que marcó tu ticket.';$('#fGasto')?.prepend(p)},0);break}
    case 'delGasto':confirmar('¿Borrar gasto?','Esta acción no se puede deshacer.','Borrar',()=>{S.gastos=S.gastos.filter(g=>g.id!==id);persist();render()});break;
    case 'mes':{const [y,m]=mesVista.split('-').map(Number);const d=new Date(y,m-1+(+el.dataset.d),1);mesVista=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'resetPrecios':confirmar('¿Restablecer precios?','Volverán los precios de referencia originales.','Restablecer',()=>{S.precios={};persist();render()});break;
    case 'copiar':{const txt=JSON.stringify(S);navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{openModal(`<h2>Respaldo</h2><p class="small muted">Copia este texto y guárdalo:</p><textarea class="search" readonly style="height:180px">${esc(txt)}</textarea><button class="btn alt block" data-act="close">Cerrar</button>`)});break}
    case 'importar':openModal(`<h2>Restaurar respaldo</h2><p class="small muted">Pega el texto del respaldo. Reemplazará tus datos actuales.</p><textarea class="search" id="impTxt" style="height:160px"></textarea><div class="btns" style="margin-top:10px"><button class="btn alt" data-act="close">Cancelar</button><button class="btn red" id="impOk">Restaurar</button></div>`);
      $('#impOk').onclick=()=>{try{const o=JSON.parse($('#impTxt').value);if(typeof o!=='object'||!o)throw 0;S=merge(o);persist();closeModal();render();toast('Datos restaurados')}catch(err){toast('El texto no es un respaldo válido')}};break;
    case 'borrarTodo':confirmar('¿Borrar todo?','Se borrarán gastos, menú, lista y precios.','Borrar todo',()=>{S=defState();persist();render();toast('Datos borrados')});break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='aOpac'){S.opac=+e.target.value;aplicarTema();persist();const v=$('#opacVal');if(v)v.textContent=S.opac+'%';return}
  if(e.target.id==='aAcento'){S.acento=e.target.value;aplicarTema();persist();return}
  if(e.target.id==='busca'){busca=e.target.value;const pos=e.target.selectionStart;render();const b=$('#busca');b.focus();b.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='aPres'){S.presupuesto=Math.max(0,+t.value||0);persist();toast('Presupuesto actualizado')}
  else if(t.id==='aPers'){S.personas=Math.min(12,Math.max(1,Math.round(+t.value||1)));t.value=S.personas;persist()}
  else if(t.dataset.precio){const id=t.dataset.precio;S.precios[id]=Object.assign({},S.precios[id],{p:Math.max(0,+t.value||0)});S.lista.forEach(i=>{if(i.pid===id&&!i.hecho)i.precio=precio(id)});persist()}
  else if(t.dataset.tienda){const id=t.dataset.tienda;S.precios[id]=Object.assign({},S.precios[id],{t:t.value});S.lista.forEach(i=>{if(i.pid===id&&!i.hecho)i.tienda=t.value});persist()}
});

  const h=(location.hash||'#inicio').slice(1);

window.addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>4),{passive:true});

/* ===================== NUBE (SUPABASE) ===================== */
// Rellena url y key (clave pública "anon") para sincronizar entre dispositivos. Vacío = solo este dispositivo.
const SUPA={url:'https://ypnpgycxujyafownmiem.supabase.co',key:'sb_publishable_9Hx79NiH-y-SY1eOEZhyig_imQkB6Y1'};
const TOKKEY='comida-tok';
let TOK=null;
function loadTok(){try{const r=sessionStorage.getItem(TOKKEY)||localStorage.getItem(TOKKEY);TOK=r?JSON.parse(r):null}catch(e){TOK=null}}
function guardaTok(t){TOK=t;try{const a=t.rem?localStorage:sessionStorage,b=t.rem?sessionStorage:localStorage;b.removeItem(TOKKEY);a.setItem(TOKKEY,JSON.stringify(t))}catch(e){}}
function borraTok(){TOK=null;try{sessionStorage.removeItem(TOKKEY);localStorage.removeItem(TOKKEY)}catch(e){}}
async function authFetch(grant,body){
  try{return await fetch(SUPA.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SUPA.key,'Content-Type':'application/json'},body:JSON.stringify(body)})}
  catch(e){e.code='unavailable';throw e}
}
async function supaLogin(id,pw,rem){
  const r=await authFetch('password',{email:USUARIOS[id].email,password:pw});
  if(!r.ok)return false;
  const j=await r.json();
  guardaTok({id,rem,access:j.access_token,refresh:j.refresh_token,exp:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000,uid:j.user.id});
  return true;
}
async function tokenValido(){
  if(Date.now()<TOK.exp)return;
  const r=await authFetch('refresh_token',{refresh_token:TOK.refresh});
  if(!r.ok){const e=new Error('auth');e.code='auth';throw e}
  const j=await r.json();
  guardaTok(Object.assign({},TOK,{access:j.access_token,refresh:j.refresh_token,exp:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000}));
}
async function sbFetch(path,opt){
  opt=opt||{};
  if(!TOK){const e=new Error('auth');e.code='auth';throw e}
  await tokenValido();
  let r;
  try{r=await fetch(SUPA.url+path,{method:opt.method||'GET',headers:Object.assign({apikey:SUPA.key,Authorization:'Bearer '+TOK.access,'Content-Type':'application/json'},opt.headers||{}),body:opt.body})}
  catch(e){e.code='unavailable';throw e}
  if(!r.ok){const e=new Error('http '+r.status);e.code=r.status===401?'auth':'http';throw e}
  return r;
}
function supaDoc(){return{
  async get(){
    const r=await sbFetch('/rest/v1/hogar?id=eq.hogar&select=json,updated_at');
    const a=await r.json();
    if(!a.length)return{exists:false};
    return{exists:true,data:()=>({json:a[0].json,at:a[0].updated_at})};
  },
  async set(o){
    await sbFetch('/rest/v1/hogar',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:'hogar',json:o.json,updated_at:new Date().toISOString()})});
  },
  // datos que cada usuario tenía guardados por separado antes de compartir
  async legacy(){
    try{const r=await sbFetch('/rest/v1/estado?user_id=eq.'+TOK.uid+'&select=json');const a=await r.json();
      return a.length?{exists:true,data:()=>({json:a[0].json})}:{exists:false}}catch(e){return{exists:false}}
  }
}}

// Las contraseñas las valida Supabase Auth (no se guardan en el código).
const USUARIOS={
  alejandro:{n:'Alejandro',email:'alejandro.comida@example.com'},
  fernanda:{n:'Fernanda',email:'fernanda.comida@example.com'},
};
const SESKEY='comida-sesion';
function getSesion(){
  if(SUPA.url){loadTok();return TOK&&USUARIOS[TOK.id]?TOK.id:null}
  try{const id=sessionStorage.getItem(SESKEY)||localStorage.getItem(SESKEY);return USUARIOS[id]?id:null}catch(e){return null}
}
let seeded=false;
function entrar(id,recordar){
  USER=id;KEY=SUPA.url?KEY0+':hogar':KEY0+':'+id;
  try{sessionStorage.removeItem(SESKEY);localStorage.removeItem(SESKEY);(recordar?localStorage:sessionStorage).setItem(SESKEY,id)}catch(e){}
  S=defState();let raw=null;seeded=false;
  try{
    raw=localStorage.getItem(KEY);
    if(!raw){   // primera vez en este dispositivo: aprovecha lo que hubiera guardado antes
      const leg=localStorage.getItem(KEY0+':'+id)||localStorage.getItem(KEY0);
      if(leg){raw=leg;seeded=!!SUPA.url}
    }
  }catch(e){}
  if(raw){try{S=merge(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  aplicaPref();
  loaded=false;editedEarly=false;docRef=null;baseAt=0;
  $('#login').classList.remove('open');
  mesVista=hoy().slice(0,7);mesFijos=mesVista;
  aplicarTema();route();initCloud();
}
function salir(){
  try{sessionStorage.removeItem(SESKEY);localStorage.removeItem(SESKEY)}catch(e){}
  borraTok();
  location.hash='';location.reload();
}
let loginUser=null,loginFails=0;
function pintaUsuarios(){
  $('#users').innerHTML=Object.entries(USUARIOS).map(([id,u])=>`<button type="button" class="ubtn ${loginUser===id?'on':''}" data-u="${id}"><span class="av">${esc(u.n[0])}</span>${esc(u.n)}</button>`).join('');
}
function mostrarLogin(){
  loginUser=null;pintaUsuarios();$('#lPass').value='';$('#lErr').textContent='';
  $('#login').classList.add('open');
}
$('#users').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;loginUser=b.dataset.u;pintaUsuarios();$('#lErr').textContent='';$('#lPass').focus()});
$('#fLogin').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=$('#lErr'),btn=$('#lBtn'),rec=$('#lRec').checked,pw=$('#lPass').value;
  if(!loginUser){err.textContent='Elige primero tu usuario';return}
  let ok=false;
  if(SUPA.url){
    btn.disabled=true;err.textContent='Entrando…';
    try{ok=await supaLogin(loginUser,pw,rec)}catch(x){err.textContent='Sin conexión. Intenta de nuevo.';btn.disabled=false;return}
    btn.disabled=false;
  }else{err.textContent='Falta configurar la nube';return}
  if(ok){loginFails=0;entrar(loginUser,rec)}
  else{
    loginFails++;err.textContent='Contraseña incorrecta';$('#lPass').value='';
    btn.disabled=true;setTimeout(()=>{btn.disabled=false},Math.min(8000,loginFails*1000));
  }
});
function iniciar(){const id=getSesion();if(id)entrar(id,SUPA.url?!!TOK.rem:!!localStorage.getItem(SESKEY));else mostrarLogin()}
iniciar();
